[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "afterword"
version = "0.3.0"
description = "Afterword — Linux desktop client for local meeting transcription"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6"]

[project.gui-scripts]
afterword = "afterword.app:main"

[tool.setuptools]
packages = ["afterword"]
