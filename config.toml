# Afterword — runs on the Mac Studio (M2 Ultra), inside ~/whisper-service/.venv

[transcribe]
# ASR runs on mlx-whisper (Metal). large-v3 = best German quality; swap to
# "mlx-community/whisper-large-v3-turbo" for ~2x speed at a small quality cost.
mlx_model = "mlx-community/whisper-large-v3-mlx"
diarize_model = "pyannote/speaker-diarization-community-1"
language = "de"             # de / en / "" for auto-detect
# constrain diarization if you know the headcount — improves accuracy
# min_speakers = 2
# max_speakers = 6
# bias vocabulary — helps with CH terms and recurring names it keeps mis-spelling
initial_prompt = "Gespräch auf Deutsch mit Schweizer Bezug: Alp, Älpler, Sennerei, kWp, Dachpacht, Photovoltaik."
# the app appends its "Namen & Begriffe" list + saved voice names per job

[summary]
ollama_url = "http://localhost:11434"   # default; the app can override this per job
ollama_model = "gpt-oss:20b"            # best for this; re-pull if removed
# used in order if ollama_model isn't on the Studio (models get cleaned up there)
fallback_models = ["gpt-oss:20b", "qwen3:14b", "qwen3:8b", "gemma3:12b", "qwen3-coder:30b", "qwen3.8:27b-mlx"]
num_ctx = 32768
temperature = 0.2
prompt = """Du bist ein sorgfältiger Protokollführer. Unten steht das wörtliche, \
nach Sprechern getrennte Transkript.

REGELN
- Personen NUR mit ihrem exakten Kürzel benennen, fett: **SPEAKER_00**, \
**SPEAKER_01** usw. Erfinde keine Namen, schreib nicht „Sprecher 1". Die Kürzel \
werden später durch echte Namen ersetzt.
- Erfinde nichts. Nur was wirklich im Transkript steht.
- Fass dich kurz: ein Gedanke pro Stichpunkt, höchstens ein bis zwei Sätze.
- Ist ein Abschnitt leer, schreib nur „–".
- Gibt es nur einen Sprecher, lass bei den To-dos die Namensnennung weg.

Erstelle ein deutsches Protokoll mit GENAU diesen Überschriften und Reihenfolge:

## Zusammenfassung
2–4 Sätze: worum ging es, was kam dabei heraus.

## Besprochene Punkte
Die Hauptpunkte des Gesprächs als Stichpunkte — auch Ideen und Argumente, \
nicht nur Beschlüsse.

## Entscheidungen
Was verbindlich beschlossen wurde, als Stichpunkte. Nur echte Entscheidungen.

## Offene Punkte
Ungeklärte Fragen und Themen, als Stichpunkte.

## To-dos
Ein Stichpunkt pro Aufgabe, IMMER in dieser Form:
- **SPEAKER_00**: Aufgabe (Frist, falls genannt)
Wenn unklar ist, wer zuständig ist:
- **Unklar**: Aufgabe
"""

[voices]
# cosine similarity above which a diarised speaker is auto-labelled with a saved
# voice. Higher = fewer false matches, more "unknown". Tune after enrolling a few.
match_threshold = 0.62
